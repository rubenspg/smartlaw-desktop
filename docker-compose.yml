services:
  postgres:
    image: postgres:16-alpine
    container_name: smartlaw-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smartlaw
      POSTGRES_USER: smartlaw
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartlaw-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlaw"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: smartlaw-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://smartlaw:${DB_PASSWORD:-smartlaw-pass}@postgres:5432/smartlaw
      # Sem valor padrão de propósito: repassa vazio se não estiver definido e o
      # servidor recusa subir (ver apps/server/src/env.ts). Não usar `:?` aqui —
      # isso quebraria `docker compose up postgres`, que nem lê esta variável.
      JWT_SECRET: ${JWT_SECRET}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  desktop:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
      args:
        - VITE_API_URL=https://smartlaw-api.rubenspg.com
    container_name: smartlaw-desktop
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  pgdata:
