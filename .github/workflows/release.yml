name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: verify tag matches app version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Tag v$TAG does not match tauri.conf.json version $APP. Bump the version and re-tag."
            exit 1
          fi
          echo "Tag and app version agree: $APP"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assina os pacotes de atualização (.app.tar.gz, setup.exe) que o app
          # instalado baixa sozinho. Sem esta chave o build falha, e é bom que
          # falhe: um pacote sem assinatura é recusado pelo app de qualquer forma.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SmartLaw ${{ github.ref_name }}"
          releaseBody: |
            **Windows:** baixe `SmartLaw_*_x64-setup.exe` (instalador) ou `SmartLaw_*_x64_en-US.msi` (instalacao gerenciada).
            O instalador nao e assinado — o Windows mostra "app nao reconhecido"; clique em *Mais informacoes* -> *Executar assim mesmo*.

            **macOS:** `SmartLaw_*_aarch64.dmg` (Apple Silicon) ou `SmartLaw_*_x64.dmg` (Intel).
          # O app instalado só enxerga a release depois de publicada: o rascunho
          # é a etapa de aprovação antes de a atualização chegar aos usuários.
          releaseDraft: true
          includeUpdaterJson: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: "apps/desktop"
